<!doctype html>
<html lang="en-gb" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site.name}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="/assets/logo/jamieLogo.ico">
<script>
// Restore the saved theme before the stylesheet paints, so a light-theme visitor never
// sees a flash of the dark ground. The toggle itself is wired at the end of the body.
(function(){try{var s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s;}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:opsz,wght@6..72,300..600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="page-{{slug}}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="/"><img src="/assets/logo/jamieLogo.jpg" alt="" width="32" height="32">{{site.name}}</a>
  <nav>{{#each site.nav}}<a href="{{this.href}}">{{this.label}}</a>{{/each}}</nav>
  <button class="theme" type="button" aria-label="Switch between the dark and light theme">◐</button>
</header>
<main id="main">{{{body}}}</main>
<footer><span>{{site.footer}}</span><a href="{{site.github}}">GitHub</a><a href="{{site.linkedin}}">LinkedIn</a><a href="mailto:{{site.email}}">Email</a></footer>
<script>
(function(){var r=document.documentElement;
document.querySelector('.theme').addEventListener('click',function(){var n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('theme',n);}catch(e){}});})();
</script>
</body>
</html>
